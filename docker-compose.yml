services:

  # ── Backend (FastAPI) ────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: ntc-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ntc_data:/data
    environment:
      DB_PATH: /data/merchants.db
      TZ: Asia/Taipei
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:3000}"
      # auth 已退役（純公開站，後端無任何 JWT 邏輯）：留空即可啟動，保留變數僅供未來啟用
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
    healthcheck:
      # /  無 DB 也回 200，改打 /api/data-info（回應即代表 app 存活；total 欄位供外部監控）
      test: ["CMD-SHELL", "curl -fs http://localhost:8000/api/data-info | grep -q total_merchants"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

  # ── Frontend (Next.js) ───────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:8000}"
        NEXT_PUBLIC_SITE_URL: "${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}"
    image: ntc-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - INTERNAL_API_URL=http://backend:8000
      - TZ=Asia/Taipei
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # alpine 無 curl，用 wget；注意 localhost 會先解 ::1（Node 只聽 v4），必須寫 127.0.0.1
      # nginx 以此 gating，避免冷啟動 502
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 10s
      start_period: 20s
      retries: 5

  # ── Scheduler (supercronic) ──────────────────────────────────────────────
  scheduler:
    build:
      context: .
      dockerfile: scheduler/Dockerfile
    image: ntc-scheduler
    restart: unless-stopped
    volumes:
      - ntc_data:/data
    environment:
      DB_PATH: /data/merchants.db
      TZ: Asia/Taipei
    healthcheck:
      # 查排程器進程存活（舊版查 update_meta.json 存在，首次灌資料前永遠紅燈）
      test: ["CMD-SHELL", "grep -qa supercronic /proc/[0-9]*/cmdline 2>/dev/null"]
      interval: 1m
      timeout: 10s
      start_period: 30s
      retries: 3

volumes:
  ntc_data:
    driver: local
