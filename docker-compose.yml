services:

  # ── Backend (FastAPI) ────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: ntc-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ntc_data:/data
    environment:
      DB_PATH: /data/merchants.db
      TZ: Asia/Taipei
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:3000}"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?must set JWT_SECRET_KEY in .env}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

  # ── Frontend (Next.js) ───────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:8000}"
    image: ntc-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - INTERNAL_API_URL=http://backend:8000
      - TZ=Asia/Taipei
    depends_on:
      backend:
        condition: service_healthy

  # ── Scheduler (supercronic) ──────────────────────────────────────────────
  scheduler:
    build:
      context: .
      dockerfile: scheduler/Dockerfile
    image: ntc-scheduler
    restart: unless-stopped
    volumes:
      - ntc_data:/data
    environment:
      DB_PATH: /data/merchants.db
      TZ: Asia/Taipei
    healthcheck:
      test: ["CMD", "ls", "/data/update_meta.json"]
      interval: 5m
      timeout: 10s
      start_period: 30s
      retries: 3

volumes:
  ntc_data:
    driver: local
