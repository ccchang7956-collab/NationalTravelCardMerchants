server {
  listen 80;

  # Docker 內網 DNS（backend/frontend 重建會換 IP）：upstream 必須經變數
  # 才能每請求重解，否則 nginx 啟動時綁死舊 IP，重建後即 502
  resolver 127.0.0.11 valid=10s;

  # 裸 /api（無尾 slash）不歸 /api/ 管，會掉進 frontend 404：轉走
  location = /api {
    return 308 /api/;
  }
  location /api/ {
    set $backend_upstream backend;
    proxy_pass http://$backend_upstream:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }
  location / {
    set $frontend_upstream frontend;
    proxy_pass http://$frontend_upstream:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }
}
