server {
  listen 80;
  server_tokens off;
  client_max_body_size 1m;

  # 限流需 http 層 limit_req_zone（本檔為 server 片段，由 conf.d 載入）：
  # 在宿主 nginx http 層加：
  #   limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
  # 本檔 /api/ 段已預留 limit_req（無 zone 時 nginx -t 會錯，故預設註解，啟用時取消註解）：
  #   limit_req zone=api burst=20 nodelay;

  # Docker 內網 DNS（backend/frontend 重建會換 IP）：upstream 必須經變數
  # 才能每請求重解，否則 nginx 啟動時綁死舊 IP，重建後即 502
  resolver 127.0.0.11 valid=10s;

  # 裸 /api（無尾 slash）不歸 /api/ 管，會掉進 frontend 404：轉走
  location = /api {
    return 308 /api/;
  }
  location /api/ {
    set $backend_upstream backend;
    proxy_pass http://$backend_upstream:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }
  location / {
    set $frontend_upstream frontend;
    proxy_pass http://$frontend_upstream:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }
}
