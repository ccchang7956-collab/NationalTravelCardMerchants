# 本地開發用覆寫設定（docker compose up 時自動套用）
# 生產環境部署時請忽略此檔案（docker compose -f docker-compose.yml up）

services:

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    volumes:
      - ntc_data:/data
      # 本地開發可直接掛載代碼（需要 uvicorn reload）
      # - ./backend:/app/backend
    environment:
      CORS_ORIGINS: "http://localhost:3000"

  scheduler:
    # 本地開發時不需要每天自動跑，改為 sleep 保持容器存活
    # 手動測試請執行：docker compose exec scheduler python /app/update_data.py
    command: ["sleep", "infinity"]
    # override 蓋掉 command 後原 healthcheck（ls update_meta.json）會誤判，
    # 本地 dev 直接停用，基底 compose 的 healthcheck 不受影響。
    healthcheck:
      disable: true
